name: Code quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend syntax, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_ENABLED: 'true'
      HITL_EMAIL_ENABLED: 'true'
      LIVE_EMAIL_INGESTION_ENABLED: 'false'
      SECOND_DRAFT_APPROVAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.12.12
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Lint Python
        run: ruff check --select E9,F63,F7,F82 backend tests
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check types and build
        run: npm run build
